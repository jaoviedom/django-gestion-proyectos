<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar proyecto</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 max-w-lg w-full border border-gray-200/50 transition-all hover:shadow-2xl">
    <!-- Encabezado -->
    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center tracking-tight">
      Editar proyecto {{ proyecto.nombre }}
    </h1>

    <form method="post" class="space-y-5">
      {% csrf_token %}

      <!-- Campo: Nombre -->
      <div>
        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">
          Nombre del proyecto
        </label>
        <input 
            type="text" 
            name="nombre" 
            id="nombre" 
            required
            value="{{ proyecto.nombre }}"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200 bg-gray-50/50 hover:bg-white">
      </div>

      <!-- Campo: Descripción -->
      <div>
        <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">
          Descripción
        </label>
        <textarea name="descripcion" id="descripcion" rows="4" required
                  class="w-full px-4 py-2.5 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200 bg-gray-50/50 hover:bg-white resize-y">{{ proyecto.descripcion }}</textarea>
      </div>

      <!-- Campo: Duración -->
      <div>
        <label for="duracion" class="block text-sm font-medium text-gray-700 mb-1">
          Duración en días
        </label>
        <input 
            type="number" 
            name="duracion" 
            id="duracion" 
            required 
            step="1" min="1"
            value="{{ proyecto.duracion }}"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200 bg-gray-50/50 hover:bg-white [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
      </div>

      <!-- Botón Guardar -->
      <button type="submit"
              class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5 focus:ring-4 focus:ring-blue-300 focus:outline-none">
        Guardar proyecto
      </button>
    </form>

    <!-- Pie de página sutil -->
    <p class="text-xs text-gray-400 text-center mt-6 select-none">
      Todos los campos son obligatorios
    </p>
  </div>
</body>
</html>
