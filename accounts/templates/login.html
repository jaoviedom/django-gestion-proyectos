{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Django AI Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4 md:p-6">

    <main class="w-full max-w-md bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl border border-white p-8 md:p-10">

        <!-- ===== Encabezado ===== -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white text-3xl shadow-lg shadow-purple-400/40 mb-4">
                <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-10 h-10">
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">
                Iniciar sesión
            </h1>
            <p class="text-sm text-slate-500 mt-2">
                Accede a tu cuenta de Django AI Lab
            </p>
        </div>

        <!-- ===== Formulario ===== -->
        <form action="{% url 'login' %}" method="post" class="space-y-5">
            {% csrf_token %}

            <!-- Campo: Usuario -->
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Nombre de usuario
                </label>
                <input type="text"
                       name="username"
                       id="username"
                       placeholder="Nombre de usuario"
                       required
                       autofocus
                       class="w-full px-4 py-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition">
            </div>

            <!-- Campo: Contraseña -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Contraseña
                </label>
                <input type="password"
                       name="password"
                       id="password"
                       placeholder="********"
                       required
                       class="w-full px-4 py-2.5 rounded-lg bg-slate-50 border border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition">
            </div>

            <!-- Botón Ingresar -->
            <button type="submit"
                    class="w-full inline-flex items-center justify-center gap-2 px-6 py-3 text-sm font-semibold text-white bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 rounded-lg shadow-md transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                Ingresar
            </button>
        </form>

        <!-- ===== Enlaces auxiliares ===== -->
        <div class="mt-6 pt-5 border-t border-slate-200 text-center text-xs text-slate-500">
            <a href="#" class="hover:text-indigo-600 font-medium transition">
                ¿Olvidaste tu contraseña?
            </a>
        </div>

        <!-- ===== Pie ===== -->
        <p class="text-xs text-slate-400 text-center mt-5 select-none flex items-center justify-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            Django AI Lab · v1.0
        </p>
    </main>

</body>
</html>
