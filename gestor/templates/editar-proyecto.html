<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar proyecto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25%      { transform: translate(50px, -60px) scale(1.1); }
            50%      { transform: translate(-40px, -80px) scale(0.95); }
            75%      { transform: translate(-60px, 40px) scale(1.05); }
        }
        @keyframes floatBlobAlt {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25%      { transform: translate(-60px, 50px) scale(1.08); }
            50%      { transform: translate(40px, 70px) scale(0.95); }
            75%      { transform: translate(70px, -40px) scale(1.05); }
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50%      { transform: translateY(-6px) rotate(3deg); }
        }
        .animate-float-blob    { animation: floatBlob 18s ease-in-out infinite; }
        .animate-float-blob-alt{ animation: floatBlobAlt 22s ease-in-out infinite; }
        .animate-float-blob-3  { animation: floatBlob 25s ease-in-out -8s infinite; }
        .animate-gradient      { background-size: 200% 200%; animation: gradientShift 5s ease infinite; }
        .animate-float-icon    { animation: floatIcon 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4 md:p-6 relative">

    <!-- Blobs decorativos: quitado overflow-hidden del body, añadido will-change para forzar composición GPU -->
    <div class="fixed -top-40 -left-40 w-[500px] h-[500px] rounded-full bg-gradient-to-br from-indigo-300 to-purple-300 blur-3xl opacity-60 animate-float-blob pointer-events-none will-change-transform"></div>
    <div class="fixed -bottom-40 -right-32 w-[450px] h-[450px] rounded-full bg-gradient-to-br from-pink-300 to-rose-300 blur-3xl opacity-60 animate-float-blob-alt pointer-events-none will-change-transform"></div>
    <div class="fixed top-1/3 left-1/2 w-[380px] h-[380px] rounded-full bg-gradient-to-br from-cyan-200 to-blue-300 blur-3xl opacity-50 animate-float-blob-3 pointer-events-none will-change-transform"></div>

    <!-- Panel principal -->
    <div class="relative z-10 w-full max-w-lg rounded-3xl bg-white/70 backdrop-blur-2xl border border-white/90 shadow-2xl shadow-indigo-200/50 p-8 md:p-10">

        <!-- Encabezado -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 text-white shadow-lg shadow-purple-400/40 mb-4 animate-float-icon">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight drop-shadow-sm">
                Editar proyecto
            </h1>
            <p class="text-sm text-slate-500 mt-2">
                Actualiza la información del proyecto
            </p>

            <!-- Badge del proyecto -->
            <div class="inline-flex items-center gap-2 mt-4 px-4 py-2 rounded-full text-sm font-semibold bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-200/60 text-indigo-600 shadow-sm max-w-full">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                <span class="truncate">{{ proyecto.nombre }}</span>
            </div>
        </div>

        <!-- Formulario -->
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- Campo: Nombre -->
            <div>
                <label for="nombre" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Nombre del proyecto
                </label>
                <input type="text" name="nombre" id="nombre" required
                       value="{{ proyecto.nombre }}"
                       placeholder="Ej. Rediseño de la web"
                       class="w-full px-4 py-2.5 rounded-xl bg-slate-50/70 border border-slate-200 text-slate-800 placeholder-slate-400 shadow-sm transition-all duration-300 hover:bg-white hover:border-purple-300 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-200/50 focus:outline-none focus:-translate-y-px">
            </div>

            <!-- Campo: Descripción -->
            <div>
                <label for="descripcion" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Descripción
                </label>
                <textarea name="descripcion" id="descripcion" rows="4" required
                          placeholder="Describe brevemente el objetivo del proyecto..."
                          class="w-full px-4 py-2.5 rounded-xl bg-slate-50/70 border border-slate-200 text-slate-800 placeholder-slate-400 shadow-sm transition-all duration-300 hover:bg-white hover:border-purple-300 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-200/50 focus:outline-none focus:-translate-y-px resize-y">{{ proyecto.descripcion }}</textarea>
            </div>

            <!-- Campo: Duración -->
            <div>
                <label for="duracion" class="block text-sm font-semibold text-slate-700 mb-1.5">
                    Duración en días
                </label>
                <input type="number" name="duracion" id="duracion" required step="1" min="1"
                       value="{{ proyecto.duracion }}"
                       placeholder="Ej. 30"
                       class="w-full px-4 py-2.5 rounded-xl bg-slate-50/70 border border-slate-200 text-slate-800 placeholder-slate-400 shadow-sm transition-all duration-300 hover:bg-white hover:border-purple-300 focus:bg-white focus:border-purple-400 focus:ring-4 focus:ring-purple-200/50 focus:outline-none focus:-translate-y-px [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
            </div>

            <!-- Botones -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 pt-2">
                <a href="{% url 'proyecto_detalle' proyecto.id %}"
                   class="order-2 sm:order-1 sm:flex-1 inline-flex items-center justify-center gap-2 px-5 py-3 text-sm font-semibold text-slate-600 bg-white/80 border border-slate-200 rounded-xl transition-all duration-300 hover:bg-white hover:border-purple-300 hover:-translate-y-px hover:shadow-lg hover:shadow-purple-200/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Cancelar
                </a>

                <button type="submit"
                        class="order-1 sm:order-2 sm:flex-[2] inline-flex items-center justify-center gap-2 px-6 py-3 text-sm font-semibold text-white rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 animate-gradient shadow-lg shadow-purple-400/50 transition-all duration-500 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-pink-400/50 focus:outline-none focus:ring-4 focus:ring-purple-200 active:translate-y-0 active:scale-[0.98]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Guardar cambios
                </button>
            </div>
        </form>

        <!-- Pie de página -->
        <p class="text-xs text-slate-400 text-center mt-6 select-none flex items-center justify-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
            Todos los campos son obligatorios
        </p>
    </div>

</body>
</html>
