{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Registro - Gestor de Proyectos</title>
</head>
<body class="antialiased text-slate-700 min-h-screen flex items-center justify-center p-4 md:p-6 bg-slate-50">

    <main class="w-full max-w-lg">
        <!-- Tarjeta de registro -->
        <div class="register-card bg-white border border-slate-200/80 rounded-2xl p-6 md:p-8 shadow-sm">
            
            <!-- Logo y título -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg mx-auto mb-4 overflow-hidden">
                    <img src="{% static 'img/logo.png' %}" alt="Logo" class="w-full h-full object-contain p-2">
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Crear cuenta</h1>
                <p class="text-sm text-slate-500 mt-1">Regístrate para comenzar a gestionar tus proyectos</p>
            </div>

            {% if errors %}
                <div class="text-red-600 border border-red-400 bg-red-50 rounded-lg p-3 mb-4 text-sm">
                    <ul class="list-disc list-inside space-y-1">
                        {% for error in errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}

            <!-- Formulario de registro -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <!-- Campo: Usuario -->
                <div class="space-y-1.5">
                    <label for="username" class="text-sm font-medium text-slate-700 flex items-center gap-2">
                        Usuario
                    </label>
                    <input 
                        type="text" 
                        name="username" 
                        id="username"
                        value="{{ datos.username|default:'' }}"
                        required
                        placeholder="Ej. juan123"
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 text-sm shadow-sm transition focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500"
                    >
                </div>

                <!-- Campo: Nombre -->
                <div class="space-y-1.5">
                    <label for="first_name" class="text-sm font-medium text-slate-700 flex items-center gap-2">
                        Nombre
                    </label>
                    <input 
                        type="text" 
                        name="first_name" 
                        id="first_name"
                        value="{{ datos.first_name|default:'' }}"
                        required
                        placeholder="Ej. Juan"
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 text-sm shadow-sm transition focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500"
                    >
                </div>

                <!-- Campo: Apellido -->
                <div class="space-y-1.5">
                    <label for="last_name" class="text-sm font-medium text-slate-700 flex items-center gap-2">
                        Apellido
                    </label>
                    <input 
                        type="text" 
                        name="last_name" 
                        id="last_name"
                        value="{{ datos.last_name|default:'' }}"
                        required
                        placeholder="Ej. Pérez"
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 text-sm shadow-sm transition focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500"
                    >
                </div>

                <!-- Campo: Email -->
                <div class="space-y-1.5">
                    <label for="email" class="text-sm font-medium text-slate-700 flex items-center gap-2">
                        Correo electrónico
                    </label>
                    <input 
                        type="email" 
                        name="email" 
                        id="email"
                        value="{{ datos.email|default:'' }}"
                        required
                        placeholder="ejemplo@correo.com"
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 text-sm shadow-sm transition focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500"
                    >
                </div>

                <!-- Campo: Contraseña -->
                <div class="space-y-1.5">
                    <label for="password1" class="text-sm font-medium text-slate-700 flex items-center gap-2">
                        Contraseña
                    </label>
                    <input 
                        type="password"
                        name="password1"
                        id="password1"
                        required
                        placeholder="********"
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 text-sm shadow-sm transition focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500"
                    >
                </div>

                <!-- Campo: Confirmar contraseña -->
                <div class="space-y-1.5">
                    <label for="password2" class="text-sm font-medium text-slate-700 flex items-center gap-2">
                        Confirmar contraseña
                    </label>
                    <input 
                        type="password"
                        name="password2"
                        id="password2"
                        required
                        placeholder="********"
                        class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-400 text-sm shadow-sm transition focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500"
                    >
                </div>

                <!-- Botón de submit -->
                <button 
                    type="submit"
                    class="w-full inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 text-white text-sm font-semibold shadow-md hover:from-indigo-600 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:ring-offset-1 transition active:scale-[0.98]"
                >
                    Crear cuenta
                </button>
            </form>

            <!-- Enlace a login -->
            <div class="mt-6 text-center text-sm text-slate-500">
                ¿Ya tienes cuenta? 
                <a href="{% url 'login' %}" class="font-medium text-indigo-600 hover:text-indigo-500 transition">
                    Inicia sesión
                </a>
            </div>
        </div>
    </main>
</body>
</html>
